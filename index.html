<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messenger v2</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
</head>

<body>
<div id="app">
    <aside class="sidebar">
        <div class="profile">
            <img id="profileAvatar">
            <div class="profile-info">
                <div id="profileName">Гость</div>
                <button id="editProfileBtn">Редактировать</button>
            </div>
        </div>

        <div class="search">
            <input id="searchInput" placeholder="Поиск чатов">
            <button id="newRoomBtn">+ Чат</button>
        </div>

        <ul id="roomsList"></ul>
    </aside>

    <main class="main">
        <div class="chat-header">
            <div id="roomTitle">Выберите чат</div>
            <div id="roomMeta"></div>
        </div>

        <div id="messages"></div>

        <form id="messageForm">
            <input id="messageInput" placeholder="Сообщение">
            <input type="file" id="fileInput">
            <button>Отправить</button>
        </form>
    </main>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDbF1Xi9ajCcLj6MfJQEhkhedOnkeo8aO8",
  authDomain: "messager-v2.firebaseapp.com",

  projectId: "messager-v2",

firebase.initializeApp(firebaseConfig);
</script>

<script src="script.js"></script>
</body>
                  </html>
